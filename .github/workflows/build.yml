name: build

on:
  push:
    branches: [main]
  # Build-only validation on PRs (e.g. Dependabot bumps) — no push to GHCR.
  pull_request:
  # Weekly rebuild with no cache so the base image + OS/Python patches are
  # genuinely refreshed even when there are no code changes.
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Log in to GHCR
        # No login on PRs — those builds don't push (and fork PRs lack the token).
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha

      # Build into the local daemon first so the smoke test can run against the
      # exact image that will be pushed. `docker build` succeeding proves very
      # little here: a server bound to the wrong interface, or a Host allowlist
      # that rejects the proxy, both produce an image that builds and a container
      # that reports healthy while every tool call fails.
      - name: Build image (load locally, no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          push: false
          # Refresh everything on the weekly scheduled rebuild.
          no-cache: ${{ github.event_name == 'schedule' }}
          tags: parcel-mcp:smoke-test
          labels: ${{ steps.meta.outputs.labels }}

      - name: Smoke test
        env:
          IMAGE: parcel-mcp:smoke-test
        run: ./scripts/smoke_test.sh

      # Retag and push the image the smoke test just passed, rather than
      # rebuilding — what ships is byte-for-byte what was tested.
      - name: Push tested image
        if: github.event_name != 'pull_request'
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          echo "$TAGS" | while read -r tag; do
            [ -n "$tag" ] || continue
            docker tag parcel-mcp:smoke-test "$tag"
            docker push "$tag"
          done
